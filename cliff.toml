# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# The changelog is generated from conventional commits on `main` by the
# release workflow. Never edit CHANGELOG.md by hand.

[changelog]
header = """
# Changelog\n
All notable changes to oxoffice. Generated by git-cliff from conventional commits.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/oxoffice-dev/oxoffice/commit/{{ commit.id }})){% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/oxoffice-dev/oxoffice/pull/{{ commit.remote.pr_number }}){% endif %}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
    {% endfor %}
{% endfor %}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ### 🙏 New contributors
    {% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
        * @{{ contributor.username }} made their first contribution
    {%- endfor %}
{% endif %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/oxoffice-dev/oxoffice/issues/${2}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactoring" },
  { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^(chore|ci|build|style)", group = "<!-- 6 -->⚙️ Maintenance" },
  { body = ".*security", group = "<!-- 7 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 8 -->◀️ Reverts" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "oxoffice-dev"
repo = "oxoffice"

[remote.github.ignore]
usernames = ["github-actions[bot]", "dependabot[bot]"]
