[package]
name = "oxoffice-pptx-wasm"
description = "WebAssembly bindings for oxoffice-pptx"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["parser-implementations", "text-processing"]
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
render = ["oxoffice-pptx/render"]

[dependencies]
oxoffice-pptx = { workspace = true, default-features = false, features = ["default-template"] }
wasm-bindgen.workspace = true

[dev-dependencies]
js-sys.workspace = true
oxoffice-opc.workspace = true
wasm-bindgen-test.workspace = true
