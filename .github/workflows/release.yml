name: Release

# Manual only, from main. Give the version, the workflow does the rest:
#   1. every build job checks out the dispatched commit and sets the version in its
#      own workspace: the `oxoffice` binary, the Python wheels and the sdist
#      for every platform; each wheel is installed on its platform, opens,
#      edits and saves four corpus files, and its conda package is built and
#      tested into a local channel
#   2. once all of it is green, one job commits the version and CHANGELOG.md
#      on top of the dispatched commit, tags that commit vX.Y.Z, builds the
#      installers, the known limitations page, an SBOM, SHA256SUMS and a
#      signed build provenance attestation, then pushes main (fast-forward,
#      or a merge commit if main moved) and the tag in one atomic push, and
#      publishes the GitHub release
#   3. publishes the wheels and the sdist to PyPI and the conda packages to
#      prefix.dev, both through trusted publishers
# Nothing reaches main or the tags before the push of step 2. Merging into
# main during the run is fine: those merges are not in the release, and the
# tag holds exactly the tree that was built. No test suite runs here: run
# the full checks (nightly.yml) on the commit first. See docs/RELEASE.md,
# specs/2026-11-21-release-pushes-after-the-builds.md and
# specs/2026-11-22-a-short-release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string
      highlights:
        description: "Highlights: a few Markdown bullets on the big changes, put first in the changelog and the release notes (\\n for a new line here)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # Read by scripts/release_highlights.py from the environment, never through a shell.
      HIGHLIGHTS: ${{ inputs.highlights }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version and the branch
        run: |
          # No prereleases yet: conda, PyPI and the GitHub release would each
          # need their own spelling or flag, and nothing maps them.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not X.Y.Z (prereleases are not supported yet)"; exit 1
          fi
          # The version commit is merged into main: a run from a branch would
          # bring that branch's commits to main.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release from main, not $GITHUB_REF"; exit 1
          fi
          # Every release opens with its highlights, written for a reader in a hurry.
          python3 scripts/release_highlights.py --check
          python3 scripts/release_highlights.py validate
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            # The tag is pushed by the last job: if the run that pushed it
            # failed after that, re-run its failed jobs instead.
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
      # The tests do not run in the release. Running the full checks
      # (nightly.yml) on the commit first is the maintainer's habit, not a gate
      # (docs/RELEASE.md).

  cli:
    name: CLI ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set the version
        shell: bash
        run: |
          rustup show active-toolchain
          python scripts/set_version.py "$VERSION"
          cargo update --workspace
      - name: Build (glibc 2.28 through zig)
        if: matrix.zig
        run: |
          python3 -m pip install --require-hashes -r .github/requirements/zig.txt
          cargo zigbuild --release --locked -p oxoffice-cli --target ${{ matrix.target }}.2.28
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p oxoffice-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="oxoffice-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE NOTICE "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/oxoffice.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/oxoffice" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  wheels:
    name: Wheels ${{ matrix.os }} ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set the version
        shell: bash
        run: |
          rustup show active-toolchain
          python scripts/set_version.py "$VERSION"
          cargo update --workspace
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -m crates/oxoffice-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set the version
        shell: bash
        run: |
          rustup show active-toolchain
          python scripts/set_version.py "$VERSION"
          cargo update --workspace
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: -m crates/oxoffice-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # Each wheel, installed on its own platform, opens, edits, saves, reopens
  # and renders four corpus files (Word, Google Docs, LibreOffice,
  # PowerPoint) on the main thread, about a minute. The conda packages
  # repackage the wheels: each one is built and its recipe's tests run
  # (imports and `oxoffice --version`) into a local channel before anything
  # is pushed; the `conda` job builds it again after the tag and uploads it.
  # The script, the corpus and the recipe come from the dispatched commit.
  wheel-check:
    name: Check ${{ matrix.wheel }}
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, wheel: wheel-ubuntu-latest-x86_64 }
          - { runner: ubuntu-24.04-arm, wheel: wheel-ubuntu-latest-aarch64 }
          - { runner: macos-latest, wheel: wheel-macos-latest-aarch64 }
          - { runner: macos-15-intel, wheel: wheel-macos-latest-x86_64 }
          - { runner: windows-latest, wheel: wheel-windows-latest-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CONDA_CHANNEL: hadim/oxoffice
      OXOFFICE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: conda/dist
      - run: python -m pip install --no-index --find-links conda/dist oxoffice
      - name: Open, edit, save and render four corpus files
        run: |
          python -I scripts/wheel_smoke.py tests/corpus/files --version "$VERSION" \
            --files word/paper.docx google/paper.docx libreoffice/paper.docx powerpoint/deck.pptx
      # The conda recipe's tests run `oxoffice --version` in its own
      # environment, which keeps this PATH after its own: the pip-installed
      # command must not answer for a conda package that lacks one.
      - name: Uninstall the wheel before the conda check
        run: |
          python -m pip uninstall -y oxoffice
          if command -v oxoffice; then echo "::error::an oxoffice command is still on PATH"; exit 1; fi
      - name: Licences
        run: |
          mkdir -p conda/dist/licenses
          cp LICENSE NOTICE crates/oxoffice-layout/fonts/LICENSE-* crates/oxoffice-layout/fonts/NOTICE-* \
            crates/oxoffice-pdf/assets/LICENSE-sRGB2014 conda/dist/licenses/
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
          cache: false
      - name: Build and test the conda package into a local channel
        run: |
          dir="$(cd "$RUNNER_TEMP" && { pwd -W 2>/dev/null || pwd; })/conda-channel"
          case "$dir" in /*) to="file://$dir" ;; *) to="file:///$dir" ;; esac
          pixi exec -s rattler-build==0.80.2 rattler-build publish conda/recipe.yaml \
            --to "$to" -c conda-forge --skip-existing all --output-dir "$RUNNER_TEMP/rattler-output"

  release:
    name: Commit, tag and GitHub release
    needs: [cli, wheels, sdist, wheel-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HIGHLIGHTS: ${{ inputs.highlights }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Look for an earlier attempt
        id: state
        shell: bash
        run: |
          # A re-run of this job after its push finds the tag on the version
          # commit it made on top of the dispatched commit.
          tag="refs/tags/v$VERSION"
          refs="$(git ls-remote origin "$tag" "$tag^{}")"
          tagged="$(printf '%s\n' "$refs" | tail -n 1 | cut -f 1)"
          if [ -n "$tagged" ]; then
            git fetch -q --force origin "$tag:$tag"
            if [ "$(git rev-parse "$tagged^" 2>/dev/null)" != "$GITHUB_SHA" ] \
              || [ "$(git log -1 --format=%s "$tagged")" != "chore(release): v$VERSION" ]; then
              echo "::error::tag v$VERSION is on $tagged, not on a version commit of this run"; exit 1
            fi
          fi
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
      - name: Set the version
        if: ${{ !steps.state.outputs.tagged }}
        run: |
          rustup show active-toolchain
          python3 scripts/set_version.py "$VERSION"
          cargo update --workspace
      - name: Changelog
        if: ${{ !steps.state.outputs.tagged }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          # Only the new release's section, put on top of the existing
          # changelog: the sections and highlights of earlier releases stay as
          # they are.
          args: --unreleased --tag v${{ inputs.version }} --prepend CHANGELOG.md
        env:
          OUTPUT: ${{ runner.temp }}/changelog-section.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: Highlights in the changelog
        if: ${{ !steps.state.outputs.tagged }}
        run: python3 scripts/release_highlights.py insert CHANGELOG.md
      # cliff.toml's GitHub remote asks the API for the commit the range ends
      # at: main for --unreleased, the tag's commit for --latest. So no range
      # may end at the unpushed version commit: before it exists the notes
      # are --unreleased from the dispatched commit, and on a re-run --latest
      # ends at the pushed tag. The chore(release) commit is skipped: same notes.
      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.state.outputs.tagged && '--latest' || format('--unreleased --tag v{0}', inputs.version) }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: Highlights in the release notes
        run: python3 scripts/release_highlights.py insert RELEASE_NOTES.md
      - name: Commit and tag
        env:
          TAGGED: ${{ steps.state.outputs.tagged }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$TAGGED" ]; then
            git checkout -q "$TAGGED"
            echo "v$VERSION is already pushed, going on"
          else
            # On the dispatched commit: the tag holds exactly the tree every
            # job built, plus the version and the changelog. Empty only if that
            # commit already held them all; still the commit to tag.
            git add Cargo.toml Cargo.lock CHANGELOG.md
            git commit --allow-empty -m "chore(release): v$VERSION"
            git tag -a "v$VERSION" -m "oxoffice v$VERSION"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Installers
        run: cp install/install.sh install/install.ps1 dist/
      - name: Limitations page
        run: |
          python3 scripts/limitations_doc.py --ref "v$VERSION" -o "dist/oxoffice-$VERSION-limitations.md"
          test -s "dist/oxoffice-$VERSION-limitations.md"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/oxoffice-${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/oxoffice-$VERSION.provenance.sigstore.json"
      - name: Push main and the tag
        if: ${{ !steps.state.outputs.tagged }}
        shell: bash
        run: |
          # The first write to the repository: every build, check and asset
          # is done. Main and the tag move in one atomic push, or neither
          # does. Main gets the version commit by a fast-forward, or by a
          # merge commit when pull requests merged during the run: they are
          # not in the release, and the tag stays on main's history.
          release="$(git rev-parse HEAD)"
          tag="refs/tags/v$VERSION"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            main="$(git rev-parse FETCH_HEAD)"
            target="$release"
            if [ "$main" != "$GITHUB_SHA" ]; then
              git checkout -q --detach "$main"
              if ! git merge -q --no-ff --no-commit "$release"; then
                # The release commit changes the version files and
                # CHANGELOG.md. Only the release
                # writes CHANGELOG.md; the version files are main's, with the
                # version set again below.
                for f in $(git diff --name-only --diff-filter=U); do
                  case "$f" in
                    CHANGELOG.md) git checkout --theirs -- "$f" ;;
                    Cargo.toml|Cargo.lock) git checkout --ours -- "$f" ;;
                    *) echo "::error::$f conflicts with main: nothing was pushed"; exit 1 ;;
                  esac
                  git add -- "$f"
                done
              fi
              # A crate or a dependency main gained during the run gets the
              # version too.
              python3 scripts/set_version.py "$VERSION" >/dev/null
              cargo update -q --workspace
              git add Cargo.toml Cargo.lock
              git commit -q -m "chore(release): merge v$VERSION into main"
              target="$(git rev-parse HEAD)"
              git checkout -q "$release"
            fi
            if git push --atomic origin "$target:refs/heads/main" "$tag"; then
              exit 0
            fi
            # The push may have landed with only its answer lost.
            refs="$(git ls-remote origin "$tag" "$tag^{}")"
            if [ "$(printf '%s\n' "$refs" | tail -n 1 | cut -f 1)" = "$release" ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::the push was refused 5 times (main kept moving, or a rule refused it): nothing was pushed"
          exit 1
      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ inputs.version }}
          name: oxoffice v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true

  pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI's trusted publisher, no token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  conda:
    name: Conda ${{ matrix.subdir }}
    needs: release
    environment: conda
    permissions:
      contents: read
      id-token: write  # the prefix.dev channel's trusted publisher
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, runner: ubuntu-latest, wheel: wheel-ubuntu-latest-x86_64 }
          - { subdir: linux-aarch64, runner: ubuntu-24.04-arm, wheel: wheel-ubuntu-latest-aarch64 }
          - { subdir: osx-arm64, runner: macos-latest, wheel: wheel-macos-latest-aarch64 }
          - { subdir: osx-64, runner: macos-15-intel, wheel: wheel-macos-latest-x86_64 }
          - { subdir: win-64, runner: windows-latest, wheel: wheel-windows-latest-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CONDA_CHANNEL: hadim/oxoffice
      OXOFFICE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: conda/dist
      - name: Licences
        run: |
          mkdir -p conda/dist/licenses
          cp LICENSE NOTICE crates/oxoffice-layout/fonts/LICENSE-* crates/oxoffice-layout/fonts/NOTICE-* \
            crates/oxoffice-pdf/assets/LICENSE-sRGB2014 conda/dist/licenses/
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
          cache: false
      # rattler-build builds the package, runs the recipe's tests again and
      # uploads it through the trusted publisher with an attestation.
      - name: Build, test and publish
        run: |
          to="https://prefix.dev/$CONDA_CHANNEL"
          pixi exec -s rattler-build==0.80.2 rattler-build publish conda/recipe.yaml \
            --to "$to" -c conda-forge --skip-existing all --output-dir "$RUNNER_TEMP/rattler-output" \
            --generate-attestation
          echo "${{ matrix.subdir }}: published to $to" >> "$GITHUB_STEP_SUMMARY"
