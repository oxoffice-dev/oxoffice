name: Release

# Manual only. Give the version, the workflow does the rest:
#   1. sets the version, regenerates CHANGELOG.md, commits and tags vX.Y.Z
#   2. builds the `oxoffice` binary and the Python wheels for every platform
#   3. publishes a GitHub release with every artifact, the installers, an SBOM,
#      SHA256SUMS and a signed build provenance attestation covering them all
#   4. publishes the wheels and the sdist to PyPI and the conda packages to
#      prefix.dev, both through trusted publishers
# With dry_run, it builds from main and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build everything but do not tag or publish"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: Version, changelog and tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
      - run: rustup show active-toolchain
      - name: Set the version
        run: |
          python3 scripts/set_version.py "$VERSION"
          cargo update --workspace
      - name: Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --tag v${{ inputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit and tag
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "oxoffice v$VERSION"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:main "v$VERSION"
            echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: CLI ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.zig
        with:
          python-version: "3.12"
      - name: Build (glibc 2.28 through zig)
        if: matrix.zig
        run: |
          python3 -m pip install --require-hashes -r .github/requirements/zig.txt
          cargo zigbuild --release --locked -p oxoffice-cli --target ${{ matrix.target }}.2.28
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p oxoffice-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="oxoffice-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE NOTICE "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/oxoffice.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/oxoffice" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  wheels:
    name: Wheels ${{ matrix.os }} ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -m crates/oxoffice-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: -m crates/oxoffice-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: GitHub release
    needs: [prepare, cli, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Installers
        run: cp install/install.sh install/install.ps1 dist/
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/oxoffice-${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        id: provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Provenance bundle
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/oxoffice-$VERSION.provenance.sigstore.json"
      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ inputs.version }}
          name: oxoffice v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true

  pypi:
    name: PyPI
    needs: [prepare, wheels, sdist, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI's trusted publisher, no token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  conda:
    name: Conda ${{ matrix.subdir }}
    needs: [prepare, wheels, publish]
    environment: conda
    permissions:
      contents: read
      id-token: write  # the prefix.dev channel's trusted publisher
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, runner: ubuntu-latest, wheel: wheel-ubuntu-latest-x86_64 }
          - { subdir: linux-aarch64, runner: ubuntu-24.04-arm, wheel: wheel-ubuntu-latest-aarch64 }
          - { subdir: osx-arm64, runner: macos-latest, wheel: wheel-macos-latest-aarch64 }
          - { subdir: osx-64, runner: macos-15-intel, wheel: wheel-macos-latest-x86_64 }
          - { subdir: win-64, runner: windows-latest, wheel: wheel-windows-latest-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CONDA_CHANNEL: hadim/oxoffice
      OXOFFICE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: conda/dist
      - name: Licences
        run: |
          mkdir -p conda/dist/licenses
          cp LICENSE NOTICE crates/oxoffice-layout/fonts/LICENSE-* crates/oxoffice-layout/fonts/NOTICE-* \
            crates/oxoffice-pdf/assets/LICENSE-sRGB2014 conda/dist/licenses/
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
          cache: false
      # rattler-build builds the package, runs the recipe's tests (imports and
      # `oxoffice --version`) and uploads it through the trusted publisher with
      # an attestation. A dry run publishes into a local channel instead.
      - name: Build, test and publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            dir="$(cd "$RUNNER_TEMP" && { pwd -W 2>/dev/null || pwd; })/conda-channel"
            case "$dir" in /*) to="file://$dir" ;; *) to="file:///$dir" ;; esac
            extra=()
          else
            to="https://prefix.dev/$CONDA_CHANNEL"
            extra=(--generate-attestation)
          fi
          pixi exec -s rattler-build==0.80.2 rattler-build publish conda/recipe.yaml \
            --to "$to" -c conda-forge --skip-existing all --output-dir "$RUNNER_TEMP/rattler-output" "${extra[@]}"
          echo "${{ matrix.subdir }}: published to $to" >> "$GITHUB_STEP_SUMMARY"
