name: CI

# One set of jobs, the same on every pull request (drafts and stacked ones
# included) and on every push to main: lint, the tests on Linux, macOS and
# Windows, and the timings on Linux.
# About 10 minutes, bounded by the slowest platform. The full sets (debug
# assertions everywhere, the whole render corpus, every producer's copy in
# the workflow walks, every scaling call) run every night in nightly.yml.
# See specs/2026-11-22-one-ci-for-pull-requests-and-main.md.
# The tests build without debug assertions (the `scaling` profile): with
# them every edit re-checks the whole document, which doubles the Rust
# tests and quadruples the Python ones. They stay in every local debug
# build and `cargo test`, in lint's pptx tests without `render`, and in
# the nightly run. Only runs on main (pushes, a dispatch on main) save the
# Rust caches; pull requests restore them
# (specs/2026-11-21-faster-build-job.md).

# Changes that only touch documentation do not build anything.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  pull_request:
    # A draft runs the same jobs: marking it ready runs nothing more.
    types: [opened, synchronize, reopened]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  workflow_dispatch:

# A pull request keeps only its latest run. Every other run is keyed by its
# event and commit: each push to main runs in full, beside the runs of the
# pushes before it, so every merge gets its verdict; a dispatch never waits
# behind or cancels a push run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PY_CRATES: --exclude oxoffice-py --exclude oxoffice-docx-py --exclude oxoffice-pptx-py

jobs:
  lint:
    name: Format, clippy, licences, WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A key of its own, renamed whenever the job compiles something new
          # (the WebAssembly steps last): main saves only on a key miss.
          key: scaling-check-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # The page is built at release: a rebase that keeps an old copy of it
      # (git add instead of git rm on the conflict) fails here.
      - name: Limitations page renders and is not committed
        run: |
          python3 scripts/limitations_doc.py > /dev/null
          if [ -n "$(git ls-files docs/LIMITATIONS.md)" ]; then
            echo "::error file=docs/LIMITATIONS.md::built at release, not committed: git rm docs/LIMITATIONS.md"
            exit 1
          fi
      - name: Wheel licence files match the root ones
        run: cmp LICENSE crates/oxoffice-py/LICENSE && cmp NOTICE crates/oxoffice-py/NOTICE
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Clippy above compiles with debug assertions, the test jobs without
      # them but only their own targets and features. This lints every crate
      # and target, all features on, without them, warnings denied: an item
      # under #[cfg(debug_assertions)] used without that cfg, or
      # crate-private code dead without it, fails here
      # (specs/2026-11-21-check-without-debug-assertions.md). It and the
      # steps after it run even when an earlier step failed, so one push
      # shows every failure.
      - name: Clippy without debug assertions
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --all-features --profile scaling -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        if: ${{ !cancelled() }}
        with:
          command: check advisories bans licenses sources
      - name: WebAssembly
        if: ${{ !cancelled() }}
        run: cargo check --target wasm32-unknown-unknown -p oxoffice-docx-wasm -p oxoffice-pptx-wasm
      # The WebAssembly bindings build the facade without rendering: an edit
      # must not need the rendering crates.
      - name: PowerPoint tests without the render feature
        if: ${{ !cancelled() }}
        run: cargo test --profile ci --locked -p oxoffice-pptx --no-default-features --features default-template --test pptx


  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      # maturin builds the wheel with MACOSX_DEPLOYMENT_TARGET=11.0. Set for
      # the whole job, cargo test shares the units both builds have in common
      # instead of rebuilding them because the variable differs (the workspace
      # crates still compile twice: their features differ).
      - name: One deployment target for the wheel and the tests
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # nightly.yml's full scaling job restores this cache (same profile),
          # its full test job only the downloaded crates (another profile).
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
      # The wheel carries both the Python package and the `oxoffice` command,
      # so one build serves the Python and the CLI checks.
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Smoke test
        shell: bash
        run: |
          python -c "import oxoffice.docx, oxoffice.pptx; print('import ok')"
          oxoffice --version
          oxoffice docx --help > /dev/null
          oxoffice pptx --help > /dev/null
      # The render tests (specs/2026-11-21-render-fidelity.md) render the
      # corpus without its long files on Linux and skip it on macOS and
      # Windows (the render is the same bytes on every platform); the nightly
      # run renders the whole corpus on the three. The workflow tests read one
      # corpus file each (specs/2026-11-21-consumer-workflows.md), every
      # producer's copy at night. Under CI an unset OXOFFICE_RENDER fails the
      # render tests.
      - name: Rust integration tests
        shell: bash
        env:
          OXOFFICE_RENDER: ${{ matrix.os == 'ubuntu-latest' && 'subset' || 'off' }}
        run: cargo test --profile scaling --locked --workspace $PY_CRATES --test '*'
      # One worker per CPU (pytest-xdist). Tests write only under tmp_path.
      - name: Python tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m pytest crates/oxoffice-py/tests -q -n auto

  # The QUICK scaling sets time one call of each area, the edits of #6
  # among them, at N and 16N (docx) or 4N (pptx): a call made linear fails.
  # Every call is timed at night. The untimed run-once test is left to the
  # test jobs. Sequential: the timings need a quiet runner.
  timings:
    name: Timings (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: timings
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wheel without debug assertions
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Scaling tests
        env:
          OXOFFICE_SCALING: quick
        run: |
          python -m pytest crates/oxoffice-py/tests/test_docx_scaling.py crates/oxoffice-py/tests/test_pptx_scaling.py \
            -q -rxX -k "not test_every_timed_call_runs_once"
