name: CI

# One set of jobs, the same on every pull request (drafts and stacked ones
# included), on every push to main and on a dispatch: lint, the Rust and
# the Python tests, and the timings.
# - Pull request: Linux runs the whole Rust and Python suites, each split
#   into shards on parallel runners; macOS and Windows run a smoke each
#   (a build of the wheel, the Rust tests of the code that touches the
#   operating system and a few Python test files). About 6 minutes.
# - Push to main and dispatch: the whole suites, sharded the same way, on
#   Linux, macOS and Windows. No schedule: the full sets (debug
#   assertions, the whole render corpus, every producer's copy in the
#   workflow walks, every scaling call) run on demand in full-checks.yml.
# See specs/2026-11-28-faster-pull-request-ci.md and
# specs/2026-11-22-one-ci-for-pull-requests-and-main.md.
# The tests build without debug assertions (the `scaling` profile): with
# them every edit re-checks the whole document, which doubles the Rust
# tests and quadruples the Python ones. They stay in every local debug
# build and `cargo test`, in lint's pptx tests without `render`, and in
# the full checks. Only runs on main (pushes, a dispatch on main) save the
# Rust caches; pull requests restore them
# (specs/2026-11-21-faster-build-job.md).

# Changes that only touch documentation do not build anything.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  pull_request:
    # A draft runs the same jobs: marking it ready runs nothing more.
    types: [opened, synchronize, reopened]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  workflow_dispatch:

# A pull request keeps only its latest run. Every other run is keyed by its
# event and commit: each push to main runs in full, beside the runs of the
# pushes before it, so every merge gets its verdict; a dispatch never waits
# behind or cancels a push run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PY_CRATES: --exclude oxoffice-py --exclude oxoffice-docx-py --exclude oxoffice-pptx-py --exclude oxoffice-xlsx-py

jobs:
  lint:
    name: Format, clippy, licences, WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A key of its own, renamed whenever the job compiles something new
          # (the WebAssembly steps last): main saves only on a key miss.
          key: scaling-check-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # The page is built at release: a rebase that keeps an old copy of it
      # (git add instead of git rm on the conflict) fails here.
      - name: Limitations page renders and is not committed
        run: |
          python3 scripts/limitations_doc.py > /dev/null
          if [ -n "$(git ls-files docs/LIMITATIONS.md)" ]; then
            echo "::error file=docs/LIMITATIONS.md::built at release, not committed: git rm docs/LIMITATIONS.md"
            exit 1
          fi
      # The name tables of oxoffice-numfmt are written from its Excel rows.
      - name: Name tables are what names.py writes
        run: |
          python3 -I crates/oxoffice-numfmt/tests/excel/names.py
          git diff --exit-code -- crates/oxoffice-numfmt/src/names/tables.rs
      - name: Release highlights script works
        run: python3 scripts/release_highlights.py --check
      - name: Wheel licence files match the root ones
        run: cmp LICENSE crates/oxoffice-py/LICENSE && cmp NOTICE crates/oxoffice-py/NOTICE
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Clippy above compiles with debug assertions, the test jobs without
      # them but only their own targets and features. This lints every crate
      # and target, all features on, without them, warnings denied: an item
      # under #[cfg(debug_assertions)] used without that cfg, or
      # crate-private code dead without it, fails here
      # (specs/2026-11-21-check-without-debug-assertions.md). It and the
      # steps after it run even when an earlier step failed, so one push
      # shows every failure.
      - name: Clippy without debug assertions
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --all-features --profile scaling -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        if: ${{ !cancelled() }}
        with:
          command: check advisories bans licenses sources
      # The workbook facade has no bindings yet; its check keeps it free of
      # what WebAssembly lacks, so that they can follow.
      - name: WebAssembly
        if: ${{ !cancelled() }}
        run: cargo check --target wasm32-unknown-unknown -p oxoffice-docx-wasm -p oxoffice-pptx-wasm -p oxoffice-xlsx
      # The WebAssembly bindings build the facade without rendering: an edit
      # must not need the rendering crates.
      - name: PowerPoint tests without the render feature
        if: ${{ !cancelled() }}
        run: cargo test --profile ci --locked -p oxoffice-pptx --no-default-features --features default-template --test pptx


  # What each platform runs, by event. Linux runs the whole suites on every
  # run, split into shards that run side by side. macOS and Windows run the
  # whole suites, sharded the same way, on every push to main and every
  # dispatch, and a smoke of each on a pull request: the Rust tests of the
  # code that touches the operating system (.config/nextest.toml, profile
  # `smoke`) and a few Python test files, on a wheel built there.
  # specs/2026-11-28-faster-pull-request-ci.md.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os

          RUST_SHARDS, PYTHON_SHARDS = 3, 4
          rust, python = [], []
          for runner in ("ubuntu-latest", "macos-latest", "windows-latest"):
              if os.environ["EVENT"] == "pull_request" and runner != "ubuntu-latest":
                  rust.append({"os": runner, "label": "smoke", "args": "--profile smoke"})
                  python.append({"os": runner, "label": "smoke", "shard": "", "fill": False})
                  continue
              for i in range(1, RUST_SHARDS + 1):
                  rust.append({"os": runner, "label": f"{i}/{RUST_SHARDS}", "args": f"--partition hash:{i}/{RUST_SHARDS}"})
              for i in range(1, PYTHON_SHARDS + 1):
                  python.append({"os": runner, "label": f"{i}/{PYTHON_SHARDS}", "shard": f"{i}/{PYTHON_SHARDS}", "fill": i == 1})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"rust={json.dumps(rust)}\npython={json.dumps(python)}\n")
          PY

  # `--lib` adds the unit tests in `src/`; oxoffice-py-support has no tests
  # and its test binary needs libpython to link. The shards split the tests
  # by a hash of their names (cargo-nextest, one process per test), the
  # tests of one binary included.
  # The render tests (specs/2026-11-21-render-fidelity.md) render the
  # corpus without its long files on Linux and skip it on macOS and
  # Windows (the render is the same bytes on every platform); the full
  # checks render the whole corpus on Linux. The workflow tests read one
  # corpus file each (specs/2026-11-21-consumer-workflows.md), every
  # producer's copy in the full checks. Under CI an unset OXOFFICE_RENDER
  # fails the render tests.
  rust:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # The one deployment target that the wheel build uses (maturin sets it
      # for the wheel), so that the tests share its units.
      - name: One deployment target for the wheel and the tests
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      # The cache `main` saves (the Python job's first shard, below):
      # downloaded crates and the third-party crates of both builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.152
      - name: Rust tests
        shell: bash
        env:
          OXOFFICE_RENDER: ${{ matrix.os == 'ubuntu-latest' && 'subset' || 'off' }}
        run: cargo nextest run --cargo-profile scaling --locked --workspace $PY_CRATES --exclude oxoffice-py-support --lib --test '*' ${{ matrix.args }}

  # The wheel carries both the Python package and the `oxoffice` command, so
  # one build serves the Python and the CLI checks. Every shard builds it
  # itself (about a minute and a half with the cache): the shards then start
  # together, with nothing to hand from one job to the next.
  python:
    name: Python tests (${{ matrix.os }}, ${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.python) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - name: One deployment target for the wheel and the tests
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      # Only a run on main saves the cache (the first shard of each platform,
      # on a key miss, and it compiles the Rust tests too, last of its steps,
      # so that the cache holds both builds); pull requests and the full
      # checks restore it. Keeping both builds in one cache is what the one
      # job of before did; full-checks.yml restores this key too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.fill }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' && matrix.fill }}
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Smoke test
        shell: bash
        run: |
          python -c "import oxoffice.docx, oxoffice.pptx; print('import ok')"
          oxoffice --version
          oxoffice docx --help > /dev/null
          oxoffice pptx --help > /dev/null
      # One worker per CPU (pytest-xdist). Tests write only under tmp_path.
      # OXOFFICE_SHARD (conftest.py) runs one of the shards of the tests. The
      # smoke of macOS and Windows on a pull request: what saves, loads and
      # reports through files, paths, the command line and the platform's
      # dates, fonts and characters.
      - name: Python tests
        shell: bash
        env:
          OXOFFICE_SHARD: ${{ matrix.shard }}
        run: |
          tests=crates/oxoffice-py/tests
          if [ -n "$OXOFFICE_SHARD" ]; then
            python -m pytest "$tests" -q -n auto
          else
            python -m pytest -q -n auto "$tests/test_save.py" "$tests/test_package_errors.py" "$tests/test_limitations.py" \
              "$tests/test_missing_glyphs.py" "$tests/test_xlsx_workbook.py" "$tests/test_non_xml_characters.py" \
              "$tests/test_core_property_dates.py"
          fi
      - name: Compile the Rust tests into the cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.fill && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: cargo test --profile scaling --locked --workspace $PY_CRATES --exclude oxoffice-py-support --lib --test '*' --no-run

  # The QUICK scaling sets time one call of each area, the edits of #6
  # among them, at N and 16N (docx) or 4N (pptx), and the reads of a
  # workbook at N and 4N rows (xlsx): a call made linear, a read made
  # quadratic, fails.
  # Every call is timed in the full checks. The untimed run-once test is left to the
  # test jobs. Sequential: the timings need a quiet runner.
  timings:
    name: Timings (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: timings
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wheel without debug assertions
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Scaling tests
        env:
          OXOFFICE_SCALING: quick
        run: |
          python -m pytest crates/oxoffice-py/tests/test_docx_scaling.py crates/oxoffice-py/tests/test_pptx_scaling.py \
            crates/oxoffice-py/tests/test_xlsx_scaling.py -q -rxX -k "not test_every_timed_call_runs_once"
