name: CI

# Every push to main, and every pull request that is ready and targets main,
# builds and tests on Linux, macOS and Windows: a platform-only failure (paths,
# line endings) shows before the merge. The jobs run in parallel, so Windows,
# the slowest, bounds the wait. A draft, or a pull request stacked on another
# branch, runs lint, WebAssembly and Linux only; it gets the full run once it
# is marked ready or rebased onto main. See
# specs/2026-11-21-lighter-ci-on-pull-requests.md.
# Everything is built once, with the `ci` profile (no LTO, workspace crates
# unoptimised, debug assertions on): the wheel carries both the Python package and the `oxoffice`
# command, so one build serves the Python and the CLI checks. Fat LTO is only
# for the release workflow.

# Changes that only touch documentation do not build anything.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "specs/**", "assets/**", "LICENSE", "NOTICE"]
  workflow_dispatch:

# A pull request keeps only its latest run. Every commit of main gets its own
# run, so no run of main is queued behind or cancelled by another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PY_CRATES: --exclude oxoffice-py --exclude oxoffice-docx-py --exclude oxoffice-pptx-py

jobs:
  lint:
    name: Format, clippy, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - run: cargo fmt --all --check
      - name: Limitations page is up to date
        run: python3 scripts/limitations_doc.py --check
      - name: Wheel licence files match the root ones
        run: cmp LICENSE crates/oxoffice-py/LICENSE && cmp NOTICE crates/oxoffice-py/NOTICE
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - run: cargo check --target wasm32-unknown-unknown -p oxoffice-docx-wasm -p oxoffice-pptx-wasm

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Three platforms unless this is a draft or a pull request stacked on
        # another branch.
        os: ${{ fromJSON((github.event_name != 'pull_request' || (github.base_ref == 'main' && !github.event.pull_request.draft)) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile ci --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Smoke test
        shell: bash
        run: |
          python -c "import oxoffice.docx, oxoffice.pptx; print('import ok')"
          oxoffice --version
          oxoffice docx --help > /dev/null
          oxoffice pptx --help > /dev/null
      - name: Rust integration tests
        shell: bash
        run: |
          if ls crates/*/tests/*.rs > /dev/null 2>&1; then
            cargo test --profile ci --locked --workspace $PY_CRATES --test '*'
          else
            echo "no Rust integration tests yet"
          fi
      - name: Python tests
        shell: bash
        run: |
          if [ -d crates/oxoffice-py/tests ]; then python -m pytest crates/oxoffice-py/tests -q; else echo "no Python tests yet"; fi

  # The scaling tests time every mutating call at N and 4N. They need a build
  # without debug assertions (the `scaling` profile), built here beside the
  # `ci` one so that pull requests wait no longer. A ready pull request into
  # main times the QUICK set on Linux; main times every call on the three
  # platforms. Drafts and stacked pull requests skip it.
  scaling:
    name: Scaling (${{ matrix.os }})
    if: github.event_name != 'pull_request' || (github.base_ref == 'main' && !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
      - name: Build the wheel without debug assertions
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Scaling tests
        shell: bash
        env:
          OXOFFICE_SCALING: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
        run: python -m pytest crates/oxoffice-py/tests/test_docx_scaling.py crates/oxoffice-py/tests/test_pptx_scaling.py -q -rxX
