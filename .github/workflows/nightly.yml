name: Full checks

# Every night, the full sets that the CI of pull requests and main leaves out
# (ci.yml): the Rust and Python tests under debug assertions on Linux, macOS
# and Windows, with the whole render corpus and every producer's copy in the
# workflow walks; every scaling call on the three platforms; the stack a
# release-profile wheel needs on the whole corpus. Nobody waits for it: a
# failure opens or updates one issue, labelled `ci-nightly`, which the next
# green run closes. A release needs a green run on its commit.
# `workflow_dispatch` runs it on any branch or tag (it reports to the issue
# only on main, when asked); `workflow_call` lets another workflow run it,
# which must grant `issues: write`: the report job asks for it even when it
# is skipped.
# See specs/2026-11-22-one-ci-for-pull-requests-and-main.md.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Open, update or close the ci-nightly issue like the nightly run"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PY_CRATES: --exclude oxoffice-py --exclude oxoffice-docx-py --exclude oxoffice-pptx-py

# The jobs restore the caches the CI of main saves (shared keys `debug`, the
# Linux wheel only, and `test`) and save none: the 10 GB of the Actions cache
# stay for main's. The debug test builds compile from scratch on macOS and
# Windows; nobody waits for them.
jobs:
  test:
    name: Full test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - name: One deployment target for the wheel and the tests
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - name: Build the wheel with debug assertions
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile ci --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
          oxoffice --version
      - name: Rust integration tests
        shell: bash
        env:
          OXOFFICE_RENDER: full
          OXOFFICE_WORKFLOWS: full
        run: cargo test --profile ci --locked --workspace $PY_CRATES --test '*'
      - name: Python tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OXOFFICE_WORKFLOWS: full
        run: python -m pytest crates/oxoffice-py/tests -q -n auto

  # Every mutating call timed at N and 16N (docx) or 4N (pptx), sequential:
  # the timings need a quiet runner. A platform-only growth shows here.
  scaling:
    name: Full scaling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: Build the wheel without debug assertions
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Scaling tests
        shell: bash
        env:
          OXOFFICE_SCALING: full
        run: python -m pytest crates/oxoffice-py/tests/test_docx_scaling.py crates/oxoffice-py/tests/test_pptx_scaling.py -q -rxX

  # The stack a user's script needs, measured on a release-profile wheel
  # (frame sizes depend on optimisation) over the whole corpus, on the main
  # thread then on threads of decreasing stack: over 1 MiB, the main thread
  # of most Windows programs that embed Python, it fails
  # (specs/2026-11-21-release-wheel-smoke-test.md). Linux only: one fat-LTO
  # build a night is the cost.
  stack:
    name: Release wheel and stack (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - name: Build the wheel with the release profile
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --release --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Open, edit, save and render the corpus, measure the stack
        run: python -I scripts/wheel_smoke.py tests/corpus/files --measure

  # One issue for a red night, so that a failure shows without anyone looking
  # at the runs: opened (or commented) on a failure, closed on the next green
  # run. Only the scheduled run, or a dispatch on main that asks for it; never
  # a run called by another workflow.
  report:
    name: Report
    needs: [test, scaling, stack]
    if: ${{ !cancelled() && github.workflow == 'Full checks' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the ci-nightly issue
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          issue="$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number // empty')"
          sha="$(cut -c1-8 <<< "$GITHUB_SHA")"
          if [ -n "$failed" ]; then
            body="$(printf 'Run %s on %s (%s) failed:\n\n%s\n' "$RUN" "$sha" "$GITHUB_REF_NAME" "$(sed 's/^/- /' <<< "$failed")")"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh label create ci-nightly --color B60205 --description "The nightly full checks failed" --force
              gh issue create --title "Nightly full checks failing" --label ci-nightly --label "area: ci" \
                --label "S2 wrong result" \
                --body "$(printf '%s\n\nSeen with: the %s run of nightly.yml on main. Closed by the next green run.\n' "$body" "$GITHUB_EVENT_NAME")"
            fi
            echo "::error::nightly checks failed: $(tr '\n' ' ' <<< "$failed")"
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Green again: $RUN on $sha."
          fi
