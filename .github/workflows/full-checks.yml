name: Full checks

# On demand, the full sets that the CI of pull requests and main leaves out
# (ci.yml): the Rust and Python tests under debug assertions (the writings
# walk apart), with the whole render corpus and every producer's copy in the
# workflow walks, on Linux only (the render is the same bytes on every
# platform and the walks are platform-free; ci.yml runs the tests on the
# three); every scaling call on Linux and Windows; the stack a
# release-profile wheel needs on the whole corpus. Budget: about an hour,
# the longest job. The full checks do not grow: a set added here takes the
# place of another, or runs a sample (docs/DEVELOPMENT.md, CI). No
# schedule: run it on a commit before releasing it (docs/RELEASE.md), and
# on a pull request whose
# change the CI of pull requests does not cover (every scaling call, the
# whole corpus). `workflow_dispatch` runs it on any branch or tag; on main,
# with `report`, a failure opens or updates one issue, labelled
# `ci-full-checks`, which the next green reporting run closes.
# `workflow_call` lets another workflow run it, which must grant
# `issues: write`: the report job asks for it even when it is skipped.
# See specs/2026-11-22-one-ci-for-pull-requests-and-main.md and
# specs/2026-11-25-full-checks-on-demand.md.

on:
  workflow_dispatch:
    inputs:
      report:
        description: "On main: open, update or close the ci-full-checks issue"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PY_CRATES: --exclude oxoffice-py --exclude oxoffice-docx-py --exclude oxoffice-pptx-py --exclude oxoffice-xlsx-py

# The jobs restore the caches the CI of main saves (shared key `test`) and
# save none: the 10 GB of the Actions cache stay for main's. The debug builds
# compile from scratch; nobody waits for them.
jobs:
  # Four shards side by side, each building the tests once; the libtest
  # filters split the test names of every binary, the shards' union is all
  # of them. The writings walk runs without debug assertions (the `scaling`
  # profile of the CI of main, whose cache it reuses): under them every edit
  # checks the whole document, and the walk took 88 minutes of a 95-minute
  # run (2026-11-27). A new shard's filter is added to the `--skip` list of
  # `rest`, so that no test runs twice.
  rust:
    name: Full Rust tests (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: render
            profile: ci
            filter: "render::"
          - name: writings
            profile: scaling
            filter: "equivalent_writings::"
          - name: compare
            profile: ci
            filter: "revisions_and_compare::"
          - name: rest
            profile: ci
            filter: "--skip render:: --skip equivalent_writings:: --skip revisions_and_compare::"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The test jobs' cache: its downloaded crates and the `scaling`
          # build; the `ci` profile builds from scratch.
          shared-key: test
          save-if: false
      # `--lib` adds the unit tests in `src/`, those gated on debug
      # assertions included (the CI of pull requests runs without them).
      - name: Rust tests
        env:
          OXOFFICE_RENDER: full
          OXOFFICE_WORKFLOWS: full
          PROFILE: ${{ matrix.shard.profile }}
          FILTER: ${{ matrix.shard.filter }}
        # FILTER is split into words on purpose.
        run: cargo test --profile "$PROFILE" --locked --workspace $PY_CRATES --exclude oxoffice-py-support --lib --test '*' -- $FILTER

  python:
    name: Full Python tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: Build the wheel with debug assertions
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile ci --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
          oxoffice --version
      - name: Python tests
        env:
          OXOFFICE_WORKFLOWS: full
        run: python -m pytest crates/oxoffice-py/tests -q -n auto

  # Every mutating call timed at N and 16N (docx) or 4N (pptx), sequential:
  # the timings need a quiet runner. A platform-only growth shows here;
  # Windows stands for the platforms other than Linux.
  scaling:
    name: Full scaling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: Build the wheel without debug assertions
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --profile scaling --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Scaling tests
        shell: bash
        env:
          OXOFFICE_SCALING: full
        run: python -m pytest crates/oxoffice-py/tests/test_docx_scaling.py crates/oxoffice-py/tests/test_pptx_scaling.py crates/oxoffice-py/tests/test_xlsx_scaling.py -q -rxX

  # The stack a user's script needs, measured on a release-profile wheel
  # (frame sizes depend on optimisation) over the whole corpus, on the main
  # thread then on threads of decreasing stack: over 1 MiB, the main thread
  # of most Windows programs that embed Python, it fails
  # (specs/2026-11-21-release-wheel-smoke-test.md). Linux only: one fat-LTO
  # build a run is the cost.
  stack:
    name: Release wheel and stack (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup show active-toolchain
      - name: Build the wheel with the release profile
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          maturin build --release --locked -m crates/oxoffice-py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Open, edit, save and render the corpus, measure the stack
        run: python -I scripts/wheel_smoke.py tests/corpus/files --measure

  # One issue for a red run of main, so that a failure shows without anyone
  # looking at the runs: opened (or commented) on a failure, closed on the
  # next green one. Only a dispatch on main that asks for it; never a run
  # called by another workflow.
  report:
    name: Report
    needs: [rust, python, scaling, stack]
    if: ${{ !cancelled() && github.workflow == 'Full checks' && github.ref == 'refs/heads/main' && inputs.report }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the ci-full-checks issue
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          issue="$(gh issue list --label ci-full-checks --state open --json number --jq '.[0].number // empty')"
          sha="$(cut -c1-8 <<< "$GITHUB_SHA")"
          if [ -n "$failed" ]; then
            body="$(printf 'Run %s on %s (%s) failed:\n\n%s\n' "$RUN" "$sha" "$GITHUB_REF_NAME" "$(sed 's/^/- /' <<< "$failed")")"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh label create ci-full-checks --color B60205 --description "The full checks failed on main" --force
              gh issue create --title "Full checks failing" --label ci-full-checks --label "area: ci" \
                --label "S2 wrong result" \
                --body "$(printf '%s\n\nSeen with: the %s run of full-checks.yml on main. Closed by the next green run on main with report=true.\n' "$body" "$GITHUB_EVENT_NAME")"
            fi
            echo "::error::full checks failed: $(tr '\n' ' ' <<< "$failed")"
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Green again: $RUN on $sha."
          fi
