[workspace]
resolver = "3"
members = [
    "crates/oxoffice-core",
    "crates/oxoffice-opc",
    "crates/oxoffice-drawing",
    "crates/oxoffice-layout",
    "crates/oxoffice-media",
    "crates/oxoffice-pdf",
    "crates/oxoffice-sml",
    "crates/oxoffice-chart",
    "crates/oxoffice-cli-support",
    "crates/oxoffice-cli",
    "crates/oxoffice-py-support",
    "crates/oxoffice-docx",
    "crates/oxoffice-docx-oxml",
    "crates/oxoffice-docx-layout",
    "crates/oxoffice-docx-html",
    "crates/oxoffice-docx-cli",
    "crates/oxoffice-docx-py",
    "crates/oxoffice-docx-wasm",
    "crates/oxoffice-pptx",
    "crates/oxoffice-pptx-oxml",
    "crates/oxoffice-pptx-layout",
    "crates/oxoffice-pptx-render",
    "crates/oxoffice-pptx-cli",
    "crates/oxoffice-pptx-py",
    "crates/oxoffice-py",
    "crates/oxoffice-pptx-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"
authors = ["oxoffice contributors"]
repository = "https://github.com/oxoffice-dev/oxoffice"
homepage = "https://github.com/oxoffice-dev/oxoffice"
keywords = ["docx", "pptx", "word", "powerpoint", "ooxml"]
categories = ["parser-implementations", "text-processing"]

[workspace.dependencies]
# Internal crates
oxoffice-core = { path = "crates/oxoffice-core", version = "0.1.0" }
oxoffice-opc = { path = "crates/oxoffice-opc", version = "0.1.0" }
oxoffice-drawing = { path = "crates/oxoffice-drawing", version = "0.1.0" }
oxoffice-layout = { path = "crates/oxoffice-layout", version = "0.1.0", default-features = false }
oxoffice-media = { path = "crates/oxoffice-media", version = "0.1.0" }
oxoffice-pdf = { path = "crates/oxoffice-pdf", version = "0.1.0", default-features = false }
oxoffice-sml = { path = "crates/oxoffice-sml", version = "0.1.0" }
oxoffice-chart = { path = "crates/oxoffice-chart", version = "0.1.0" }
oxoffice-cli-support = { path = "crates/oxoffice-cli-support", version = "0.1.0" }
oxoffice-cli = { path = "crates/oxoffice-cli", version = "0.1.0", default-features = false }
oxoffice-py-support = { path = "crates/oxoffice-py-support", version = "0.1.0" }
oxoffice-docx = { path = "crates/oxoffice-docx", version = "0.1.0", default-features = false }
oxoffice-docx-oxml = { path = "crates/oxoffice-docx-oxml", version = "0.1.0" }
oxoffice-docx-layout = { path = "crates/oxoffice-docx-layout", version = "0.1.0", default-features = false }
oxoffice-docx-html = { path = "crates/oxoffice-docx-html", version = "0.1.0" }
oxoffice-docx-cli = { path = "crates/oxoffice-docx-cli", version = "0.1.0", default-features = false }
oxoffice-docx-py = { path = "crates/oxoffice-docx-py", version = "0.1.0" }
oxoffice-pptx = { path = "crates/oxoffice-pptx", version = "0.1.0", default-features = false }
oxoffice-pptx-oxml = { path = "crates/oxoffice-pptx-oxml", version = "0.1.0" }
oxoffice-pptx-layout = { path = "crates/oxoffice-pptx-layout", version = "0.1.0" }
oxoffice-pptx-render = { path = "crates/oxoffice-pptx-render", version = "0.1.0", default-features = false }
oxoffice-pptx-cli = { path = "crates/oxoffice-pptx-cli", version = "0.1.0", default-features = false }
oxoffice-pptx-py = { path = "crates/oxoffice-pptx-py", version = "0.1.0" }

# External dependencies
#
# Feature sets are deliberately minimal: a DOCX is a ZIP that only ever uses
# the Stored and Deflate methods, so the zip aes-crypto/bzip2/lzma/ppmd/zstd/xz
# codecs and the `time` timestamp support are all dead weight, and they drag in
# getrandom -> wasm-bindgen/js-sys. Agile encryption uses the separate,
# default-off RustCrypto and CFB dependencies below. Likewise fontdb's `memmap`
# feature is off because fonts are read into memory anyway, and it avoids
# memmap2 entirely.
zip = { version = "9.0.5", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
quick-xml = "0.41"
thiserror = "2"
aes = "0.9.2"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
cfb = "0.14.0"
encoding_rs = "0.8.35"
getrandom = "0.3.4"
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
ring = { version = "0.17.14", default-features = false, features = ["std"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
fontdb = { version = "0.23", default-features = false, features = [
    "std",
    "fs",
    "fontconfig",
] }
harfrust = "0.12"
hypher = { version = "=0.1.7", default-features = false, features = [
    "alloc",
    "english",
    "french",
    "german",
    "spanish",
] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = [
    "auto",
    "compiled_data",
] }
ttf-parser = "0.25"
unicode-bidi = "=0.3.18"
unicode-linebreak = "0.1"
itoa = "1"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.27", default-features = false, features = ["errors"] }
lopdf = { version = "0.44.0", default-features = false }
smallvec = "1.15"
pdf-writer = "0.15"
subsetter = "0.2"
miniz_oxide = "0.9"
tiny-skia = "0.12"
gif = "0.14.2"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
jpeg-encoder = { version = "=0.6.0", default-features = false }
tiff = { version = "0.11.3", default-features = false }
wasm-bindgen = "0.2.126"
wasm-bindgen-test = "=0.3.76"
js-sys = "0.3.103"
pyo3 = { version = "=0.29.0", features = ["abi3-py310"] }

# Release builds (the release workflow only): smallest and fastest binaries,
# slow to compile because of fat LTO and one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# CI builds: quick to compile, with debug assertions and overflow checks on.
# The workspace crates are not optimised (most of the build time is in them),
# the dependencies are, so tests still run at a decent speed. Never used for
# a release.
[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
incremental = false
debug-assertions = true
overflow-checks = true
strip = false

[profile.ci.package."*"]
opt-level = 1
