# Corpus copies a workflow test fails on today, read by the workflow tests of
# the docx test binary (specs/2026-11-21-consumer-workflows.md).
# Written by hand. Like every known failure of the suite, an entry is strict:
# once the copy passes the workflow, the test fails until the entry goes.
# `message` is text the failure must hold, so that a failure with another
# cause still fails the test.

# compare-after-edit: an edit inside a text box in mc:AlternateContent is
# redlined as the whole box deleted and inserted, and the deleted copy keeps
# w:t in the box's paragraphs inside the w:del: the redline fails validation.

