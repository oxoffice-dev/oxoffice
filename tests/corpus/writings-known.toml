# Differences equivalent writings give today (specs/2026-11-25-equivalent-
# xml-writings.md), strict: an unlisted one fails, and so does an entry that
# no longer happens. `input` is a name, or `*.docx`/`*.pptx` for a class
# (stale only under the full checks); `message` is text the finding holds;
# `debug_assertions` keeps an entry to builds with or without them. One block
# per class, never reordered, so branches merge cleanly.

# A: an empty element written with an end tag is read only from an
# empty-element tag: the Event::Empty arms model it, the Event::Start arm
# keeps it raw or skips it: a tab or break leaves the text (oxoffice-docx
# document/story_paragraphs.rs:332-347), bold, italic and paragraph toggles
# are not modelled (oxoffice-docx-oxml run_properties.rs:791 against :1157,
# which models only rtl and lang).

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "accept xml"
issue = 664
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "compare"
issue = 664
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "compare xml"
issue = 664
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "edit"
issue = 664
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "edit xml"
issue = 664
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "markdown"
issue = 664
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "save"
issue = 664
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "text"
issue = 664
message = "gives another result"

# B: an attribute value is parsed from its raw bytes, its references
# unresolved: w:w="&#49;2240" is no number (oxoffice-docx-oxml
# properties.rs:510 fed by raw reads, about 80 `from_utf8(&attr.value)` in
# src), a:bodyPr anchor and insets (oxoffice-drawing text/body.rs);
# oxoffice_core::xml::attribute_text resolves them.

# D1: an edited paragraph declares `w` only, and writes `r:id` with no
# binding: the part written is no XML (oxoffice-docx-oxml
# text/emission.rs:542-547 restore_word_binding,
# text/paragraph_write.rs:789-795); debug assertions see it first as ids the
# saved package does not read back.

[[known]]
input = "google/contract.docx"
writing = "other-prefixes"
operation = "edit"
issue = 658
message = "reads other identifiers than it holds"
debug_assertions = true

[[known]]
input = "word/contract.docx"
writing = "other-prefixes"
operation = "edit"
issue = 658
message = "reads other identifiers than it holds"
debug_assertions = true

[[known]]
input = "google/contract.docx"
writing = "other-prefixes"
operation = "edit xml"
issue = 658
message = "the prefix of r:id is not bound"
debug_assertions = false

[[known]]
input = "word/contract.docx"
writing = "other-prefixes"
operation = "edit xml"
issue = 658
message = "the prefix of r:id is not bound"
debug_assertions = false

# D2: a fragment the comparison cuts out is read without the bindings of the
# part: ox0:history is not w:history (oxoffice-docx
# comparison/fields.rs:1203-1253).

# D3: a namespace is looked up on three elements only, the prefix `a` assumed:
# a:alphaModFix under another prefix is kept raw, its opacity unread
# (oxoffice-drawing fill.rs:724-745).

[[known]]
input = "google/deck.pptx"
writing = "other-prefixes"
operation = "edit xml"
issue = 658
message = "alphaModFix"

[[known]]
input = "google/pitch.pptx"
writing = "other-prefixes"
operation = "edit xml"
issue = 658
message = "alphaModFix"

