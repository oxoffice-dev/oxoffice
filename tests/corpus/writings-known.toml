# Inputs whose equivalent writings give another result than the original
# today, read by the writings tests of the docx and pptx test binaries
# (specs/2026-11-25-equivalent-xml-writings.md). Written by hand. Like every
# known failure of the suite, an entry is strict: a difference not listed
# fails the test, and an entry that no longer happens fails it too, so that
# a fix removes its entries. `input` is an input's name, or `*` and the end
# of the names it stands for (`*.docx`) for a class met on many inputs: such
# an entry is checked for staleness by the full checks only. `message` is
# text the finding must hold, so that a difference with another cause still
# fails. `debug_assertions = true` marks an entry only a build with debug
# assertions meets (the full checks: one of their cross-checks fails first),
# `false` one only a build without them meets (pull requests). Entries are
# grouped by root cause; each issue is #658 until its class has an issue of
# its own.

# A: an empty element written with an end tag is read only from an
# empty-element tag: the Event::Empty arms model it, the Event::Start arm
# keeps it raw or skips it: a tab or break leaves the text (oxoffice-docx
# document/story_paragraphs.rs:332-347), bold, italic and paragraph toggles
# are not modelled (oxoffice-docx-oxml run_properties.rs:791 against :1157,
# which models only rtl and lang).

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "accept xml"
issue = 658
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "compare"
issue = 658
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "compare xml"
issue = 658
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "edit"
issue = 658
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "edit xml"
issue = 658
message = "reads otherwise"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "markdown"
issue = 658
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "save"
issue = 658
message = "gives another result"

[[known]]
input = "*.docx"
writing = "empty-with-end-tag"
operation = "text"
issue = 658
message = "gives another result"

