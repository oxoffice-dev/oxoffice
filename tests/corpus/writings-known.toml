# Differences equivalent writings give today (specs/2026-11-25-equivalent-
# xml-writings.md), strict: an unlisted one fails, and so does an entry that
# no longer happens. `input` is a name, or `*.docx`/`*.pptx` for a class
# (stale only under the full checks); `message` is text the finding holds;
# `debug_assertions` keeps an entry to builds with or without them. One block
# per class, never reordered, so branches merge cleanly.

# B: an attribute value is parsed from its raw bytes, its references
# unresolved: w:w="&#49;2240" is no number (oxoffice-docx-oxml
# properties.rs:510 fed by raw reads, about 80 `from_utf8(&attr.value)` in
# src), a:bodyPr anchor and insets (oxoffice-drawing text/body.rs);
# oxoffice_core::xml::attribute_text resolves them. Tracked by #668; no
# writing here meets it since `leading-character-reference` was dropped.

# D1: an edited paragraph declares `w` only, and writes `r:id` with no
# binding: the part written is no XML (oxoffice-docx-oxml
# text/emission.rs:542-547 restore_word_binding,
# text/paragraph_write.rs:789-795); debug assertions see it first as ids the
# saved package does not read back.

# D2: a fragment the comparison cuts out is read without the bindings of the
# part: ox0:history is not w:history (oxoffice-docx
# comparison/fields.rs:1203-1253).

# D3: a namespace is looked up on three elements only, the prefix `a` assumed:
# a:alphaModFix under another prefix is kept raw, its opacity unread
# (oxoffice-drawing fill.rs:724-745).

# D5: the replay of nested namespace owners cannot match an owner written
# another way: oxoffice-docx document/namespace_replay.rs:206-280.

# D6: a paragraph's w:cnfStyle under another prefix is kept raw where the
# original's is rewritten from the model: the edit writes it otherwise
# (oxoffice-docx-oxml paragraph properties).

# O: the original fails too: no writing is to blame: the original refuses the
# comparison otherwise.

# H: compare after an edit D1 (`r:id` unbound) or D6 (`w:cnfStyle` kept raw)
# broke: these go with their class.
