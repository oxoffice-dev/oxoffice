# Render checks that fail today, read by the render tests of the docx and
# pptx test binaries (specs/2026-11-21-render-fidelity.md). Written by hand.
#
# Each entry is a file, the check it fails, the pages it fails on (0 for the
# whole document, with how its finding starts, such as "43 words") and its
# issue, or `by_design = "<why>"` when the page is right as it is. Like
# every known failure of the suite, an entry is strict: once the file passes
# the check on those pages, or its finding changes, the test fails until the
# entry is updated or goes.

